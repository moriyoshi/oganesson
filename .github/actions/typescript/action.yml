name: TypeScript-Go checkout
description: >
  Populates third_party/typescript at the commit pinned in
  scripts/sync-typescript.sh and installs the _tsoverlay/ogapi facade into it.
  go.mod's replace directive needs it for every build.
runs:
  using: composite
  steps:
    - name: Restore third_party/typescript
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: third_party/typescript
        key: typescript-${{ hashFiles('scripts/sync-typescript.sh') }}
    # Always runs: it is a no-op checkout when the cache hit, and it reinstalls
    # the facade from this commit's _tsoverlay/ogapi.
    - name: Sync TypeScript-Go
      shell: bash
      run: scripts/sync-typescript.sh
